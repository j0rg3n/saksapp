# Local development only. Compose loads this automatically when present; the deploy script sends
# just docker-compose.yml and Caddyfile to the VM, so production is unaffected.
services:
  caddy:
    environment:
      SAKSAPP_DOMAIN: saksapp.test
    volumes:
      - ./Caddyfile.local:/etc/caddy/Caddyfile:ro
      - ${SAKSAPP_CADDY_DATA_DIR:-./caddy_data}:/data
      - ${SAKSAPP_CADDY_CONFIG_DIR:-./caddy_config}:/config
