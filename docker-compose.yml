services:
  # TLS termination. Obtains and renews Let's Encrypt certificates automatically and redirects
  # HTTP to HTTPS. Port 80 stays open only for the ACME challenge and that redirect.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ${SAKSAPP_CADDY_DATA_DIR:-./caddy_data}:/data
      - ${SAKSAPP_CADDY_CONFIG_DIR:-./caddy_config}:/config
    env_file:
      # Deliberately not auth/secret.env: the proxy has no business holding SMTP credentials.
      - ${SAKSAPP_AUTH_DIR:-./auth}/caddy.env
    depends_on:
      - saksappweb

  saksappweb:
    image: saksappweb
    build:
      context: .
      dockerfile: SaksAppWeb/Dockerfile
    # Loopback only. The app must not be reachable except through the proxy; this binding exists
    # for local debugging and is not exposed off the host.
    ports:
      - "127.0.0.1:8080:8080"
    dns:
      - 8.8.8.8
      - 8.8.4.4
    volumes:
      - ${SAKSAPP_DB_DIR:-./SaksAppWeb/db}:/app/db:rw
      - ${SAKSAPP_KEYS_DIR:-./SaksAppWeb/dp_keys}:/app/dp_keys:rw
    env_file:
      - ${SAKSAPP_AUTH_DIR:-./auth}/secret.env
    environment:
      - SMTP__HOST=send.one.com
      - SMTP__PORT=465
      # Sized for the production VM's 9.8 GB disk, not left to the defaults. The database is ~45 MB
      # and grows ~8 MB/week from attachments, so a snapshot compresses to roughly 40 MB.
      # 24 hourly snapshots is short-term insurance only; Phase 6B moves the archive to Drive.
      - Backup__MaxFiles=24
      - Backup__MaxTotalBytes=805306368   # 768 MB
      # Never let a snapshot take the disk below this. A full disk makes SQLite report every write
      # as "attempt to write a readonly database", which is what took the app down on 2026-09-08.
      - Backup__MinFreeBytes=1610612736   # 1.5 GB

  test:
    build:
      context: .
      dockerfile: Dockerfile.tests
    environment:
      - TEST_ARGS=-p:CollectCoverage=true
    profiles:
      - test
